<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D9E75">
<title>EcoSistema da Construção</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
  .login-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 380px; }
  .brand-header { text-align: center; margin-bottom: 32px; }
  .brand-icon { width: 64px; height: 64px; background: #1D9E75; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .brand-icon i { font-size: 32px; color: #fff; }
  .brand-name { font-size: 22px; font-weight: 700; color: #fff; }
  .brand-tag { font-size: 13px; color: #64748b; margin-top: 4px; }
  .login-card { background: #1e293b; border: 0.5px solid #334155; border-radius: 16px; padding: 28px 24px; }
  .login-tabs { display: flex; gap: 4px; background: #0f172a; border-radius: 10px; padding: 3px; margin-bottom: 24px; }
  .login-tab { flex: 1; padding: 9px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: #64748b; transition: all .15s; }
  .login-tab.active { background: #1D9E75; color: #fff; }
  .field-label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
  .field-input { width: 100%; padding: 11px 14px; border: 0.5px solid #334155; border-radius: 10px; background: #0f172a; color: #f1f5f9; font-size: 14px; outline: none; font-family: inherit; margin-bottom: 14px; transition: border-color .15s; }
  .field-input:focus { border-color: #1D9E75; }
  .field-input::placeholder { color: #475569; }
  .btn-login { width: 100%; padding: 13px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .btn-login:hover { background: #157a5a; }
  .btn-login:disabled { opacity: .5; cursor: not-allowed; }
  .link-forgot { background: none; border: none; color: #1D9E75; font-size: 13px; cursor: pointer; width: 100%; text-align: center; margin-top: 14px; padding: 4px; }
  .error-box { background: #450a0a; border: 0.5px solid #7f1d1d; color: #fca5a5; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
  .error-box.show { display: block; }
  .success-box { background: #052e16; border: 0.5px solid #14532d; color: #86efac; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
  .success-box.show { display: block; }
  .info-text { font-size: 11px; color: #475569; text-align: center; margin-top: 12px; line-height: 1.5; }
  .divider-text { text-align: center; color: #475569; font-size: 12px; margin: 16px 0; }
  .footer-bar { text-align: center; padding: 16px; color: #334155; font-size: 11px; }
  .security-badge { display: flex; align-items: center; justify-content: center; gap: 6px; color: #475569; font-size: 11px; margin-top: 16px; }
  .security-badge i { font-size: 14px; color: #1D9E75; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="brand-header">
      <div class="brand-icon"><i class="ti ti-building-community"></i></div>
      <div class="brand-name">EcoSistema</div>
      <div class="brand-tag">Gestão de obras e serviços</div>
    </div>

    <div class="login-card">
      <div class="login-tabs">
        <button class="login-tab active" id="tab-entrar" onclick="mudarAba('entrar')">Entrar</button>
        <button class="login-tab" id="tab-cadastrar" onclick="mudarAba('cadastrar')">Criar conta</button>
      </div>

      <div class="error-box" id="msg-erro"></div>
      <div class="success-box" id="msg-sucesso"></div>

      <!-- ENTRAR -->
      <form id="form-entrar">
        <label class="field-label">E-mail</label>
        <input class="field-input" type="email" id="login-email" placeholder="seu@email.com" required autocomplete="email">
        <label class="field-label">Senha</label>
        <input class="field-input" type="password" id="login-senha" placeholder="••••••••" required autocomplete="current-password">
        <button type="submit" class="btn-login" id="btn-entrar">Entrar</button>
        <div class="divider-text">ou</div>
        <button type="button" class="btn-login" id="btn-google" onclick="entrarComGoogle()" style="background:#fff;color:#1a1a1a;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;gap:10px">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
          Entrar com Google
        </button>
        <button type="button" class="link-forgot" onclick="mudarAba('recuperar')">Esqueci minha senha</button>
      </form>

      <!-- CADASTRAR -->
      <form id="form-cadastrar" style="display:none">
        <label class="field-label">Nome completo</label>
        <input class="field-input" type="text" id="cad-nome" placeholder="Seu nome" required>
        <label class="field-label">Telefone</label>
        <input class="field-input" type="tel" id="cad-telefone" placeholder="(00) 00000-0000">
        <label class="field-label">E-mail</label>
        <input class="field-input" type="email" id="cad-email" placeholder="seu@email.com" required autocomplete="email">
        <label class="field-label">Senha</label>
        <input class="field-input" type="password" id="cad-senha" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
        <button type="submit" class="btn-login" id="btn-cadastrar">Criar conta de cliente</button>
        <p class="info-text">Após criar a conta, o administrador precisará aprovar seu acesso antes que você possa entrar no sistema.</p>
      </form>

      <!-- RECUPERAR -->
      <form id="form-recuperar" style="display:none">
        <p style="color:#94a3b8;font-size:13px;margin-bottom:16px">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>
        <label class="field-label">E-mail cadastrado</label>
        <input class="field-input" type="email" id="rec-email" placeholder="seu@email.com" required>
        <button type="submit" class="btn-login" id="btn-recuperar">Enviar link de recuperação</button>
        <button type="button" class="link-forgot" onclick="mudarAba('entrar')">← Voltar ao login</button>
      </form>
    </div>

    <div class="security-badge">
      <i class="ti ti-lock"></i>
      <span>Conexão segura • Dados criptografados</span>
    </div>
  </div>
</div>

<div class="footer-bar">EcoSistema da Construção © 2026</div>
<div class="toast" id="toast"></div>

<script type="module">
import { login, cadastrarCliente, recuperarSenha, observarAuth, mensagemErroFirebase, loginComGoogle } from './js/auth.js';

window.entrarComGoogle = async function() {
  const btn = document.getElementById('btn-google');
  btn.disabled = true; btn.textContent = 'Aguarde...';
  try {
    await loginComGoogle();
    // observarAuth cuida do redirecionamento
  } catch(err) {
    if (err.code !== 'auth/popup-closed-by-user') erro(mensagemErroFirebase(err));
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg> Entrar com Google`;
  }
};

window.mudarAba = function(aba) {
  document.getElementById('msg-erro').classList.remove('show');
  document.getElementById('msg-sucesso').classList.remove('show');
  document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('form-entrar').style.display = 'none';
  document.getElementById('form-cadastrar').style.display = 'none';
  document.getElementById('form-recuperar').style.display = 'none';
  if (aba === 'entrar') { document.getElementById('tab-entrar').classList.add('active'); document.getElementById('form-entrar').style.display = 'block'; }
  if (aba === 'cadastrar') { document.getElementById('tab-cadastrar').classList.add('active'); document.getElementById('form-cadastrar').style.display = 'block'; }
  if (aba === 'recuperar') { document.getElementById('form-recuperar').style.display = 'block'; }
};

function erro(m) { const el = document.getElementById('msg-erro'); el.textContent = m; el.classList.add('show'); document.getElementById('msg-sucesso').classList.remove('show'); }
function sucesso(m) { const el = document.getElementById('msg-sucesso'); el.textContent = m; el.classList.add('show'); document.getElementById('msg-erro').classList.remove('show'); }

observarAuth((user, perfil) => {
  if (!user || !perfil) return;
  if (perfil.tipo === 'admin') window.location.href = 'admin/index.html';
  else if (perfil.tipo === 'cliente' && perfil.status === 'aprovado') window.location.href = 'cliente/index.html';
  else if (perfil.tipo === 'cliente') window.location.href = 'pendente.html';
});

document.getElementById('form-entrar').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    await login(document.getElementById('login-email').value.trim(), document.getElementById('login-senha').value);
  } catch (err) { erro(mensagemErroFirebase(err)); btn.disabled = false; btn.textContent = 'Entrar'; }
});

document.getElementById('form-cadastrar').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-cadastrar');
  btn.disabled = true; btn.textContent = 'Criando conta...';
  try {
    await cadastrarCliente(document.getElementById('cad-nome').value.trim(), document.getElementById('cad-email').value.trim(), document.getElementById('cad-senha').value, document.getElementById('cad-telefone').value.trim());
    window.location.href = 'cliente/index.html';
  } catch (err) { erro(mensagemErroFirebase(err)); btn.disabled = false; btn.textContent = 'Criar conta de cliente'; }
});

document.getElementById('form-recuperar').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-recuperar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    await recuperarSenha(document.getElementById('rec-email').value.trim());
    sucesso('Link enviado! Verifique seu e-mail e pasta de spam.');
    btn.disabled = false; btn.textContent = 'Enviar link de recuperação';
  } catch (err) { erro(mensagemErroFirebase(err)); btn.disabled = false; btn.textContent = 'Enviar link de recuperação'; }
});
</script>
</body>
</html>
